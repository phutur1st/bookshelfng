name: Hom3lab Bookshelf build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hom3lab-bookshelf-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.401"
  READARR_VERSION: 0.4.21
  OUTPUT_FOLDER: ./_output
  ARTIFACTS_FOLDER: ./_artifacts
  TESTS_FOLDER: ./_tests
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      build_version: ${{ steps.variables.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Setup Environment Variables
        id: variables
        shell: bash
        run: |
          echo "SDK_PATH=${{ env.DOTNET_ROOT }}/sdk/${DOTNET_VERSION}" >> "$GITHUB_ENV"
          echo "DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"
          build_version="0.4.21.65"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"
          echo "Resolved BookshelfNG version: $build_version"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            _cache/node
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Cache MSBuild outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/msbuild
          key: msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
          restore-keys: |
            msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
            msbuild-${{ runner.os }}-

      - name: Cache Webpack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: _cache/webpack
          key: webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
            webpack-${{ runner.os }}-

      - name: Check release-note tooling
        run: node --test scripts/release-notes.test.mjs scripts/validate-release-publisher-config.test.mjs

      - name: Build
        shell: bash
        run: ./build.sh --backend --frontend
        env:
          READARRVERSION: ${{ steps.variables.outputs.build_version }}

      - name: Install Chromium for direct-download browser tests
        run: pwsh ./_tests/net10.0/linux-x64/playwright.ps1 install --with-deps chromium

      - name: Prepare tests
        run: |
          mkdir -p _tests/bin
          cp _output/net10.0/linux-x64/publish/Readarr _tests/bin/
          chmod +x _tests/bin/Readarr
          find _tests -name "Readarr.Test.Dummy" -exec chmod a+x {} \;

      - name: Test
        shell: bash
        env:
          DIRECT_DOWNLOAD_REQUIRE_PLAYWRIGHT: "true"
        run: ./test.sh Linux Unit Test

      - name: Report test results
        uses: dorny/test-reporter@2bf7bc7bba0f63da7f183274c61b24c27fb03989 # v3
        if: always()
        with:
          name: Unit Test Results
          path: "**/TestResult.xml"
          list-tests: "failed"
          reporter: dotnet-nunit
          fail-on-error: true

      - name: Upload container build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookshelfng-publish-output
          path: _output/
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish personal Hardcover image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: bookshelfng-publish-output
          path: _output
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Derive personal image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "phutur1st/bookshelfng"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image }}:hom3lab
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            GIT_BRANCH=${{ github.ref_name }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            IMAGE_VERSION=${{ needs.build.outputs.build_version }}
            IMAGE_FLAVOR=hardcover
            METADATA_URL=https://hardcover.bookinfo.pro
            HARDCOVER=true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
